<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training Log">
<meta name="theme-color" content="#F2EEE5">
<title>Training Log</title>
<style>
:root{
  --bg:#F2EEE5; --card:#FDFBF7; --ink:#1C211D; --ink2:#3F473F; --mut:#5E655D;
  --line:#D3CBB9; --line2:#A99F8A; --green:#3E6B2C; --green-d:#2F5722;
  --tint:#E4ECD8; --fill:#E8E2D5; --ring:#D6E5C6; --skip:#ECE7DB; --danger:#9A3A2A;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --num:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;font-size:17px;line-height:1.35;
  -webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,textarea{-webkit-appearance:none;appearance:none;border-radius:0}

/* ---- app shell: only the middle scrolls; the tab bar is part of layout ---- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-t)}
#scroller{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;position:relative}
#scroller.snap{scroll-snap-type:y proximity}
#compact{position:absolute;left:0;right:0;top:var(--safe-t);height:52px;display:none;align-items:center;justify-content:center;
  background:rgba(242,238,229,.97);border-bottom:1.5px solid var(--line);font-size:17px;font-weight:600;z-index:5}
#compact.show{display:flex}
nav{flex-shrink:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;
  background:#fff;border-top:2px solid var(--line2);box-shadow:0 -6px 16px rgba(40,35,20,.07);
  padding:8px 12px calc(8px + var(--safe-b))}
nav button{height:54px;border:0;border-radius:14px;background:none;font-size:12px;font-weight:500;color:var(--mut);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button svg{stroke:var(--mut)}
nav button.on{background:var(--tint);color:var(--green-d);font-weight:700}
nav button.on svg{stroke:var(--green)}
nav button:active{background:#DCE6CC}

/* ---- header ---- */
.hdr{padding:14px 20px 16px;scroll-snap-align:start;border-bottom:1.5px solid var(--line)}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{margin:0;font-size:34px;font-weight:700;letter-spacing:.2px;line-height:1.1}
.datepill{position:relative;display:inline-flex;align-items:center;height:38px;padding:0 15px;border-radius:19px;
  background:#E5E0D4;font-size:16px;font-weight:600;white-space:nowrap}
.datepill:active{background:#D9D3C5}
.datepill input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0}
.seg{margin-top:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:3px;border-radius:12px;background:#E3DED2}
.seg button{height:42px;border:0;border-radius:9px;background:transparent;font-size:16px;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:7px}
.seg button:active{background:#D6D0C2}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(40,35,20,.18);font-weight:700}
.dot{width:7px;height:7px;border-radius:4px;background:var(--green);flex-shrink:0}

#view{padding:6px 16px 28px}
.sect{font-size:15px;font-weight:600;color:var(--mut);padding:16px 4px 8px}

/* ---- cards ---- */
.card{border:1.5px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:10px}
.card.open{border:2px solid var(--green);box-shadow:0 2px 10px rgba(62,107,44,.10)}
.card.open.snapme{scroll-snap-align:start;scroll-margin-top:62px}
.chead{display:flex;align-items:flex-start;gap:10px;padding:14px 12px 12px 16px}
.cinfo{flex:1;min-width:0}
.cname{font-size:19px;font-weight:700;letter-spacing:-.2px}
.card.open .cname{font-size:22px}
.ctarget{font-size:16px;margin-top:3px;font-variant-numeric:tabular-nums}
.clast{font-size:15px;color:var(--mut);margin-top:2px;font-variant-numeric:tabular-nums}
.ccue{font-size:15px;color:var(--ink2);margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--bg)}
.tapzone{display:block;width:100%;text-align:left;border:0;background:none;padding:0}
.arrows{display:flex;border-radius:10px;background:#EEE9DE;flex-shrink:0;overflow:hidden}
.arrows button{width:44px;height:42px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.arrows button:active{background:#DDD6C8}
.arrows button:disabled{opacity:.3}
.arrows i{width:1.5px;background:var(--line);margin:8px 0}
.rule{height:1.5px;background:var(--line)}
.rule.in{margin:0 16px}
.cbody{padding:12px 16px 14px}
.frow{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.frow:last-child{margin-bottom:0}
.flabel{font-size:13px;font-weight:600;color:var(--mut)}
.weight{display:flex;align-items:baseline;justify-content:center;gap:5px;width:170px;height:58px;border-radius:12px;background:var(--fill);
  padding-top:12px;border:0}
.weight input{width:70px;border:0;background:transparent;font-family:var(--num);font-size:28px;font-weight:700;text-align:right;padding:0;outline:none}
.weight span{font-size:16px;font-weight:600;color:var(--mut)}
.weight:focus-within{background:#fff;box-shadow:inset 0 0 0 2.5px var(--green),0 0 0 4px var(--ring)}
.sets{display:grid;gap:10px}
.box{height:58px;width:100%;border:0;border-radius:12px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line);
  font-family:var(--num);font-size:26px;font-weight:700;text-align:center;padding:0;font-variant-numeric:tabular-nums}
.box::placeholder,.weight input::placeholder{color:#C7BFAE;font-weight:500}
.box:focus{outline:none;background:#fff;box-shadow:inset 0 0 0 2.5px var(--green),0 0 0 4px var(--ring)}
.setlab{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mut);text-align:center}
.rirbox{width:76px}
.area{width:100%;min-height:84px;border:0;border-radius:12px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line);
  padding:11px 12px;font-size:17px;line-height:1.4;resize:vertical}
.area:focus{outline:none;background:#fff;box-shadow:inset 0 0 0 2.5px var(--green),0 0 0 4px var(--ring)}
.notebox{margin:0 16px 12px}
.notebox .area{min-height:64px;font-style:italic;background:#EFEADF}
.cfoot{display:flex;align-items:center;padding:8px 12px 8px 6px}
.tbtn{height:46px;padding:0 12px;border:0;background:none;font-size:17px;color:var(--mut);border-radius:10px}
.tbtn:active{background:#ECE7DB}
.spacer{flex:1}
.pill{height:46px;padding:0 18px;border:1.5px solid #B9B09C;border-radius:23px;background:var(--card);font-size:17px;font-weight:500;
  display:inline-flex;align-items:center;gap:6px}
.pill:active{background:#ECE7DB}
.pill.has{border:2px solid var(--green);background:var(--tint);color:var(--green-d);font-weight:700}
.go{height:46px;padding:0 26px;margin-left:8px;border:0;border-radius:23px;background:var(--green);color:#fff;font-size:17px;font-weight:600}
.go:active{background:var(--green-d)}

/* ---- done list ---- */
.dlist{border:1.5px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;margin-bottom:10px}
.drow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 16px;border:0;background:none;text-align:left}
.drow:active{background:#F1EDE4}
.drow + .drow,.dlist .card + .drow,.dlist .drow + .card{border-top:1.5px solid var(--line)}
.drow .dn{flex:1;font-size:17px;min-width:0}
.drow .ds{font-size:15px;color:var(--mut);text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.drow.sk{background:var(--skip)}
.tag{font-size:12px;font-weight:700;color:var(--ink2);border:1.5px solid #8A8F86;border-radius:6px;padding:2px 6px}
.dlist .card{border:0;border-radius:0;margin:0;box-shadow:none;background:#fff}

/* ---- buttons / forms ---- */
.big{display:block;width:100%;height:56px;border:0;border-radius:16px;background:var(--green);color:#fff;font-size:18px;font-weight:600;margin-top:14px}
.big:active{background:var(--green-d)}
.big.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line2);font-weight:600}
.big.ghost:active{background:#ECE7DB}
.big:disabled{opacity:.45}
.panel{border:1.5px solid var(--line);border-radius:16px;background:var(--card);padding:14px 16px 16px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:12px}
.txt{height:52px;border:0;border-radius:12px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line);padding:0 14px;font-size:18px;font-weight:500;color:var(--ink)}
.txt.num{font-family:var(--num);font-size:22px;font-weight:700;text-align:center}
.txt::placeholder,.area::placeholder{color:#B0A897;font-weight:400}
.txt:focus{outline:none;background:#fff;box-shadow:inset 0 0 0 2.5px var(--green),0 0 0 4px var(--ring)}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chips button{height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;font-weight:500}
.chips button:active{background:#ECE7DB}
.chips button.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.hint{font-size:14px;color:var(--mut);margin:6px 4px 0}
.err{border:2px solid var(--danger);border-radius:16px;background:#FBEFEC;padding:14px 16px;color:#5A1F14;margin:12px 0}
.err b{display:block;margin-bottom:6px}

/* saved + history */
.savedhd{display:flex;align-items:center;gap:10px}
.srow{display:flex;gap:10px;padding:11px 16px;font-size:16px}
.srow + .srow{border-top:1.5px solid var(--line)}
.srow b{flex:1;font-weight:600}
.srow span{color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.srow.sk{background:var(--skip)}
.hsess{border-top:1.5px solid var(--line)}
.hsess:first-child{border-top:0}
.hbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:8px 16px;border:0;background:none;text-align:left}
.hbtn:active{background:#F1EDE4}
.hbtn b{flex:1;font-size:17px;font-weight:600}
.hbtn span{font-size:15px;color:var(--mut)}
.hdet{padding:0 16px 14px;font-size:15px;color:var(--ink2);line-height:1.5}
.hdet div{padding:3px 0}
.linkbtn{border:0;background:none;color:var(--danger);font-size:16px;padding:10px 0;font-weight:600}
details.more{margin-top:10px}
details.more summary{list-style:none;font-size:16px;color:var(--mut);padding:12px 4px;cursor:pointer}
details.more summary::-webkit-details-marker{display:none}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.nudge{color:var(--green-d);font-size:15px;font-weight:600;margin:4px 4px 0}

/* sheet + toast */
#scrim{position:fixed;inset:0;background:rgba(28,33,29,.35);display:none;align-items:flex-end;z-index:20}
#scrim.show{display:flex}
#sheet{width:100%;max-height:80%;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;border-top:2px solid var(--line2);
  padding:18px 16px calc(18px + var(--safe-b))}
#sheet h2{margin:0 0 4px;font-size:20px}
#sheet .sub{color:var(--mut);font-size:15px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:12px 14px;margin-bottom:8px}
.opt:active{background:#ECE7DB}
.opt.on{border:2px solid var(--green);background:var(--tint)}
.opt b{display:block;font-size:17px}
.opt span{font-size:14px;color:var(--mut)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-b));background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:15px;font-weight:600;display:none;z-index:30;max-width:86%;text-align:center}
#toast.show{display:block}
</style>
</head>
<body>
<div id="app">
  <div id="scroller" class="snap"><div id="hdr"></div><div id="view"></div></div>
  <div id="compact"></div>
  <nav>
    <button data-tab="workout"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 9v6M21 9v6M6 6v12M18 6v12M6 12h12"/></svg>Workout</button>
    <button data-tab="extra"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Extra</button>
    <button data-tab="history"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
  </nav>
</div>
<div id="scrim"><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script src="programme.js"></script>
<script>
"use strict";
var BUILD = "3.0.0", APP_SCHEMA = 3;
var LS = "tl_data_v1", DK = "tl_draft_v3", RK = "tl_ruck_v3", MK = "tl_mode_v3";
var P = window.PROGRAMME || null;

/* ================= programme check ================= */
function validateProgramme(p) {
  var e = [];
  if (!p) return ["The programme file didn’t load or has a typo."];
  if (p.schema !== APP_SCHEMA) e.push("The app and programme file are from different updates (programme format " + p.schema + ", app expects " + APP_SCHEMA + ").");
  var L = p.library || {}, IN = ["reps", "sec", "text"], LD = ["kg", "kg/hand", "bw", "bw+", "none"];
  Object.keys(L).forEach(function (k) {
    var d = L[k]; if (d.retired) return;
    if (!d.name) e.push("Library ‘" + k + "’ has no name.");
    if (IN.indexOf(d.input) < 0) e.push("Library ‘" + k + "’: input must be reps, sec or text.");
    if (LD.indexOf(d.load) < 0) e.push("Library ‘" + k + "’: load must be kg, kg/hand, bw, bw+ or none.");
    if (d.side && d.side !== "leg" && d.side !== "side") e.push("Library ‘" + k + "’: side must be leg or side.");
  });
  ["A", "B"].forEach(function (t) {
    var day = p.days && p.days[t];
    if (!day || !Array.isArray(day.list)) { e.push("Day " + t + " is missing."); return; }
    var seen = {};
    day.list.forEach(function (x, i) {
      var d = L[x.key];
      if (!d) e.push("Day " + t + " item " + (i + 1) + ": unknown key ‘" + x.key + "’. Add it to the library first.");
      else if (d.retired) e.push("Day " + t + ": ‘" + x.key + "’ is retired. Keys are never reused — make a new key.");
      if (seen[x.key]) e.push("Day " + t + ": ‘" + x.key + "’ appears twice.");
      seen[x.key] = 1;
      if (d && !d.retired && d.input !== "text") {
        if (!(x.sets >= 1 && x.sets <= 8 && Math.floor(x.sets) === x.sets)) e.push("Day " + t + " ‘" + x.key + "’: sets must be a whole number from 1 to 8.");
        if (d.setLabels && d.setLabels.length !== x.sets) e.push("Day " + t + " ‘" + x.key + "’: setLabels has " + d.setLabels.length + " labels but sets is " + x.sets + ".");
      }
    });
  });
  return e;
}
var PERR = validateProgramme(P);
var OK = PERR.length === 0;

/* ================= storage ================= */
function fresh() { return { version: 3, bodyweight: "", sessions: [], exportedUpto: null }; }
function readJSON(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast("Couldn’t save — storage full or blocked"); } }
var DATA = Object.assign(fresh(), readJSON(LS) || {});
if (!Array.isArray(DATA.sessions)) DATA.sessions = [];
function persist() { writeJSON(LS, DATA); }

/* sessions without an id get one below the current minimum (idempotent, from v2) */
(function () {
  var miss = []; DATA.sessions.forEach(function (s, i) { if (s.id == null) miss.push(i); });
  if (!miss.length) return;
  var min = Infinity; DATA.sessions.forEach(function (s) { if (s.id != null && s.id < min) min = s.id; });
  if (min === Infinity) min = Date.now();
  miss.forEach(function (idx, j) { DATA.sessions[idx].id = min - (miss.length - j); });
  persist();
})();
/* one-time v3 setup: bodyweight to 90 kg (Neko, Oct 2026). Sessions untouched. */
if (!DATA.v3) { DATA.v3 = true; DATA.version = 3; DATA.bodyweight = "90"; persist(); }
if ("storage" in navigator && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) {} }

/* ================= helpers ================= */
function $(id) { return document.getElementById(id); }
function esc(s) { return (s == null ? "" : String(s)).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function todayISO() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function fmtDate(iso) { try { var d = new Date(iso + "T00:00"); if (isNaN(d)) return iso; return d.toLocaleDateString("en-GB", { weekday: "short" }) + " " + d.getDate() + " " + d.toLocaleDateString("en-GB", { month: "short" }); } catch (e) { return iso; } }
function shortDate(iso) { try { return new Date(iso + "T00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" }); } catch (e) { return iso; } }
var toastT;
function toast(m) { var t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("show"); }, 1900); }
function lib(k) { return (P && P.library[k]) || null; }
function dayEntries(type) {
  return P.days[type].list.map(function (x) {
    var d = lib(x.key);
    return { key: x.key, def: d, sets: d.input === "text" ? 0 : x.sets, target: x.target || "", load: x.load == null ? "" : x.load, rirT: x.rir || "", cue: x.cue || d.cue || "" };
  });
}
function entryFor(type, key) { var a = dayEntries(type); for (var i = 0; i < a.length; i++) if (a[i].key === key) return a[i]; return null; }
function loadWord(load) { return load === "kg/hand" ? "kg/hand" : load === "bw+" ? "added kg" : "kg"; }
function groupLabels(labels) {
  var out = [], i = 0;
  while (i < labels.length) { var j = i; while (j < labels.length && labels[j] === labels[i]) j++; out.push((j - i) + " " + labels[i]); i = j; }
  return out.join(" + ");
}
function targetText(en) {
  var d = en.def; if (d.input === "text") return "";
  var setsPart = d.setLabels ? groupLabels(d.setLabels) : String(en.sets);
  var each = en.target + (d.input === "sec" ? " s" : "") + (d.side ? "/" + d.side : "");
  var parts = [setsPart + " × " + each];
  if (d.load === "kg" && en.load !== "") parts.push(en.load + " kg");
  else if (d.load === "kg/hand" && en.load !== "") parts.push(en.load + " kg/hand");
  else if (d.load === "bw" || (d.load === "bw+" && en.load === "")) parts.push("bodyweight");
  else if (d.load === "bw+") parts.push("+" + en.load + " kg");
  if (en.rirT) parts.push("RIR " + en.rirT);
  return parts.join(" · ");
}

/* ---- item views: one reader for old (v2) and new (v3) items ---- */
function hasOldVals(it) { if (!it.values) return false; for (var k in it.values) if (it.values[k] !== "") return true; return false; }
function newHasVals(it) { return (it.sets || []).some(function (v) { return v !== ""; }) || (it.load || "") !== "" || (it.text || "") !== ""; }
function itemView(it) {
  var v = { key: it.key, name: it.name, base: it.base, swapped: !!it.swapped, note: it.note || "", rir: it.rir == null ? "" : String(it.rir), goal: it.goal || it.target || "" };
  if (it.values) { /* v2 shape */
    v.isText = it.key === "wu"; v.text = (it.values && it.values.text) || "";
    v.status = it.done ? "done" : it.skipped ? "skipped" : (hasOldVals(it) ? "logged" : "");
    var act = [], sum = [];
    for (var k in it.values) { if (it.values[k] === "" || k === "text") continue; var lab = (it.flabels && it.flabels[k]) || k; act.push(lab + ":" + it.values[k]); sum.push(/^reps\/set$/.test(lab) ? it.values[k] : it.values[k] + " " + lab); }
    v.actual = act; v.summary = v.isText ? v.text : sum.join(" · "); v.hasVals = hasOldVals(it);
    return v;
  }
  v.isText = it.input === "text"; v.text = it.text || "";

    + '<button class="big" style="margin-top:0" data-act="backup">Back up to Files</button>'
    + '<button class="big ghost" data-act="restore">Restore from a backup file</button>'
    + '<input type="file" id="restoreFile" accept=".json,application/json,text/plain" style="display:none">'
    + '<div class="hint">' + (DATA.lastBackup ? "Last backup: " + esc(new Date(DATA.lastBackup).toLocaleDateString("en-GB")) : "No backup taken in this version yet.") + ' Restoring only adds sessions that aren’t already here.</div>'
    + '<details class="more"><summary>More: export everything, backup as text</summary>'
    + '<button class="big ghost" data-act="copyall">Copy full history for Claude</button>'
    + '<button class="big ghost" data-act="copybackup">Copy backup as text</button>'
    + '<textarea class="area mono" id="pastebox" style="margin-top:10px" placeholder="To restore from text: paste a backup here, then tap Restore from text"></textarea>'
    + '<button class="big ghost" data-act="restoretext">Restore from text</button>'
    + '<div class="hint">App ' + BUILD + ' · ' + esc(P ? P.version : "no programme") + '</div></details>';
  return h;
}
function detailHTML(s) {
  if (s.type === "A" || s.type === "B") {
    var rows = s.items.map(function (it) {
      var v = itemView(it);
      if (v.isText) return v.text ? '<div>Warm-up: ' + esc(v.text) + '</div>' : "";
      if (!v.status && !v.note) return "";
      if (v.status === "skipped") return '<div>' + esc(v.name) + ' — skipped' + (v.note ? " — " + esc(v.note) : "") + '</div>';
      var line = esc(v.name) + (v.swapped ? " (for " + esc(v.base) + ")" : "") + ": " + esc(v.summary || "—");
      if (v.rir && v.summary.indexOf("RIR") < 0) line += " · RIR " + esc(v.rir);
      if (v.note) line += " — " + esc(v.note);
      return '<div>' + line + '</div>';
    }).join("");
    return (s.snote ? '<div><i>' + esc(s.snote) + '</i></div>' : "") + rows;
  }
  return '<div>' + esc(oneLine(s)) + '</div>';
}

/* ================= export (format unchanged from v2) ================= */
function buildText(list) {
  var L = ["=== TRAINING LOG ==="];
  L.push("program: " + (P ? P.version : "?") + "  ·  units: kg  ·  exported: " + new Date().toLocaleDateString("en-GB"));
  if (DATA.bodyweight) L.push("latest bodyweight: " + DATA.bodyweight + " kg");
  L.push("line format: [key] name | status | goal | actual(labelled, reps/set comma-separated) | RIR | note");
  L.push("note: exercises are listed in the order performed", "");
  L.push("Sessions: " + list.length, "");
  list.forEach(function (s) {
    if (s.type === "A" || s.type === "B") {
      var hdr = "[" + s.date + "] Day " + s.type; if (s.prog) hdr += "  ·  prog:" + s.prog; if (s.bw) hdr += "  ·  BW:" + s.bw + "kg";
      L.push(hdr); if (s.snote) L.push("  session-note: " + s.snote);
      s.items.forEach(function (it) {
        var v = itemView(it);
        if (v.isText) {
          if (!v.text && !v.note && v.status !== "skipped" && v.status !== "done") return;
          var wl = "  - [" + v.key + "] " + v.name; if (v.status === "skipped") wl += " | status: skipped"; else if (v.text) wl += ": " + v.text;
          if (v.note) wl += " | note: " + v.note; L.push(wl); return;
        }
        if (!v.status && !v.note) return;
        var nm = v.swapped ? v.name + " (swapped from " + v.base + ")" : v.name;
        var line = "  - [" + v.key + "] " + nm + " | status: " + (v.status || "logged");
        if (v.status === "skipped") { if (v.note) line += " | note: " + v.note; L.push(line); return; }
        if (v.goal) line += " | goal: " + v.goal;
        line += " | actual: " + (v.actual.length ? v.actual.join(", ") : "—");
        if (v.rir !== "") line += " | RIR: " + v.rir;
        if (v.note) line += " | note: " + v.note;
        L.push(line);
      });
    } else if (s.type === "ruck") {
      var b = []; if (s.route) b.push("route:" + s.route); if (s.load) b.push("load:" + s.load + "kg"); if (s.duration) b.push("duration:" + s.duration + "min");
      if (s.distance) b.push("distance:" + s.distance + "km"); var p = pace(s); if (p) b.push("pace:" + p + "/km"); if (s.elevation) b.push("elevation:" + s.elevation + "m");
      if (s.hrAvg) b.push("HRavg:" + s.hrAvg); if (s.hrMax) b.push("HRmax:" + s.hrMax); if (s.feel) b.push("feel:" + s.feel);
      L.push("[" + s.date + "] RUCK | " + b.join(" · ") + (s.note ? " | " + s.note : ""));
    } else if (s.type === "extra") {
      var x = "[" + s.date + "] EXTRA · " + s.category, bits = [];
      if (s.duration) bits.push("duration:" + s.duration + "min"); if (s.hrAvg) bits.push("HRavg:" + s.hrAvg); if (s.hrMax) bits.push("HRmax:" + s.hrMax); if (s.feel) bits.push("feel:" + s.feel);
      if (bits.length) x += " | " + bits.join(" · "); if (s.text) x += " | " + s.text; L.push(x);
    } else if (s.type === "aerobic") {
      L.push("[" + s.date + "] Easy: " + s.modality + " " + (s.duration || "?") + " min" + (s.feel ? " — " + s.feel : "") + (s.note ? " — " + s.note : ""));
    } else L.push("[" + s.date + "] Other (" + (s.tag || "") + "): " + (s.text || ""));
    L.push("");
  });
  return L.join("\n");
}

/* ================= actions ================= */
function moveIn(list, k, dir) { var i = list.indexOf(k), j = i + dir; if (i < 0 || j < 0 || j >= list.length) return; list[i] = list[j]; list[j] = k; }
function finish(k, status) {
  var it = draft.items[k]; it.status = status; it.doneAt = Date.now(); it.noteOpen = false; it.cueOpen = false;
  draft.todo = draft.todo.filter(function (x) { return x !== k; }); if (draft.done.indexOf(k) < 0) draft.done.push(k);
  draft.open = draft.todo[0] || null; saveDraft(); render(); alignOpen();
}
function alignOpen() {
  var c = document.querySelector(".card.open.snapme"); if (!c) return;
  var sc = $("scroller"), target = c.offsetTop - 62;
  if (sc.scrollTop > 40 && Math.abs(sc.scrollTop - target) > 8) sc.scrollTop = Math.max(0, target);
}
function saveSession() {
  var marked = draft.done.length;
  if (!marked) { toast("Mark at least one exercise Done or Skip first"); return; }
  var left = draft.todo.filter(function (k) { return !newHasVals(draft.items[k]); }).length;
  if (draft.todo.length && !confirm(draft.todo.length + " exercise" + (draft.todo.length === 1 ? " isn’t" : "s aren’t") + " marked. Save anyway?" + (left ? " Unmarked ones with nothing entered are left out." : ""))) return;
  var order = draft.done.concat(draft.todo), en = {};
  dayEntries(draft.type).forEach(function (e) { en[e.key] = e; });
  var items = order.map(function (k) {
    var it = JSON.parse(JSON.stringify(draft.items[k])); delete it.noteOpen; delete it.cueOpen;
    it.done = it.status === "done"; it.skipped = it.status === "skipped";
    it.target = en[k] ? targetText(en[k]) : "";
    if (it.input === "text") it.sets = [];
    return it;
  });
  var rec = { id: Date.now(), v: 3, type: draft.type, date: draft.date || todayISO(), snote: draft.snote || "", prog: P.version, bw: DATA.bodyweight || "", items: items };
  DATA.sessions.push(rec); DATA.savedState = { id: rec.id }; persist();
  draft = null; localStorage.removeItem(DK);
  $("scroller").scrollTop = 0; render(); toast("Session saved");
}
function saveRuckSession() {
  var r = ruck;
  if (!r.duration && !r.distance && !r.route) { toast("Add a route, duration or distance first"); return; }
  var rec = { id: Date.now(), type: "ruck", date: r.date || todayISO(), route: r.route.trim(), load: r.load, duration: r.duration, distance: r.distance, elevation: r.elevation, hrAvg: r.hrAvg, hrMax: r.hrMax, feel: r.feel, note: r.note.trim() };
  DATA.sessions.push(rec); DATA.savedState = { id: rec.id }; persist();
  ruck = blankRuck(); saveRuck(); $("scroller").scrollTop = 0; render(); toast("Ruck saved");
}
function startNew() {
  delete DATA.savedState; persist();
  if (draft && draftTouched(draft)) { setMode(draft.type); }
  else { var t = nextUp(); draft = newDraft(t); saveDraft(); setMode(t); }
  $("scroller").scrollTop = 0; render();
}
function switchMode(m) {
  if (m === mode) return;
  if (m === "ruck") { setMode("ruck"); render(); return; }
  if (draft && draft.type !== m && draftTouched(draft)) {
    if (!confirm("Start Day " + m + " instead? Your Day " + draft.type + " entries will be cleared.")) return;
  }
  if (!draft || draft.type !== m) { var d = draft ? draft.date : todayISO(); draft = newDraft(m); draft.date = d; saveDraft(); }
  setMode(m); render();
}
function copyText(text, onOk) {
  function fallback() { var b = $("iobox") || $("pastebox"); if (b) { b.style.display = "block"; b.value = text; b.focus(); b.select(); } toast("Tap and hold the box, then Copy"); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { if (onOk) onOk(); }, fallback); else fallback();
}
function copyNew() {
  var mark = DATA.exportedUpto || 0, nw = DATA.sessions.filter(function (s) { return s.id > mark; });
  if (!nw.length) { toast("Nothing new since last copy"); return; }
  var newMark = nw.reduce(function (m, s) { return s.id > m ? s.id : m; }, mark);
  copyText(buildText(nw), function () { DATA.exportedUpto = newMark; persist(); toast("Copied " + nw.length + " session" + (nw.length === 1 ? "" : "s")); render(); });
}
function markBackedUp() { DATA.lastBuild = BUILD; DATA.lastBackup = Date.now(); persist(); render(); }
function backup() {
  var json = JSON.stringify(DATA), name = "training-log-backup-" + todayISO() + ".json";
  try {
    var file = new File([json], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).then(function () { markBackedUp(); toast("Backup saved"); }, function (e) { if (e && e.name !== "AbortError") toast("Backup didn’t complete — try Copy backup as text"); });
      return;
    }
  } catch (e) {}
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], { type: "application/json" })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); markBackedUp(); toast("Backup downloaded");
}
function mergeRestore(text) {
  var d; try { d = JSON.parse(text); } catch (e) { toast("That isn’t a backup file"); return; }
  if (!d || !Array.isArray(d.sessions)) { toast("That isn’t a backup file"); return; }
  var have = {}; DATA.sessions.forEach(function (s) { have[s.id] = 1; });
  var add = d.sessions.filter(function (s) { return s && s.id != null && !have[s.id]; });
  if (!add.length) { toast("Nothing new — every session in that backup is already here"); return; }
  if (!confirm("Add " + add.length + " session" + (add.length === 1 ? "" : "s") + " from this backup? Nothing already here will change.")) return;
  var wasEmpty = DATA.sessions.length === 0;
  DATA.sessions = DATA.sessions.concat(add).sort(function (a, b) { return a.id - b.id; });
  if (wasEmpty) { if (d.exportedUpto != null) DATA.exportedUpto = d.exportedUpto; if (d.bodyweight && !DATA.bodyweight) DATA.bodyweight = d.bodyweight; }
  if (DATA.exportedUpto == null) DATA.exportedUpto = DATA.sessions.reduce(function (m, s) { return s.id > m ? s.id : m; }, 0);
  persist(); render(); toast("Added " + add.length + " session" + (add.length === 1 ? "" : "s"));
}

/* ---- swap sheet ---- */
function openSwap(k) {
  var it = draft.items[k], d = lib(k), h = '<h2>Swap ' + esc(it.base) + '</h2><div class="sub">Each swap keeps its own history.</div>';
  if (it.swapped) h += '<button class="opt" data-sw="__revert"><b>Back to ' + esc(it.base) + '</b><span>Restore the original</span></button>';
  (d.swaps || []).forEach(function (s) { var l = lastFor(k, s, true); h += '<button class="opt' + (it.name === s ? " on" : "") + '" data-sw="' + esc(s) + '"><b>' + esc(s) + '</b><span>' + (l ? "Last " + esc(l) : "No history yet") + '</span></button>'; });
  h += '<label class="field" style="margin-top:6px">Or type your own<input class="txt" id="swCustom" placeholder="Exercise name"></label>'
    + '<button class="big" data-sw="__custom" style="margin-top:0">Use this name</button><button class="big ghost" data-sw="__cancel">Cancel</button>';
  $("sheet").innerHTML = h; $("scrim").classList.add("show");
  $("sheet").querySelectorAll("[data-sw]").forEach(function (b) {
    b.onclick = function () {
      var v = b.getAttribute("data-sw");
      if (v === "__cancel") return closeSheet();
      if (v === "__revert") { it.name = it.base; it.swapped = false; }
      else if (v === "__custom") { var c = $("swCustom").value.trim(); if (!c) { $("swCustom").focus(); return; } it.name = c; it.swapped = true; }
      else { it.name = v; it.swapped = true; }
      saveDraft(); closeSheet(); render();
    };
  });
}
function closeSheet() { $("scrim").classList.remove("show"); }
$("scrim").addEventListener("click", function (e) { if (e.target === $("scrim")) closeSheet(); });

/* ---- event delegation ---- */
$("view").addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  var a = b.getAttribute("data-act"), k = b.getAttribute("data-k");
  if (a === "open") { draft.open = k; saveDraft(); render(); var c = document.querySelector('[data-card="' + k + '"]'); if (c && draft.todo.indexOf(k) >= 0) $("scroller").scrollTop = Math.max(0, c.offsetTop - 62); }
  else if (a === "cue") { draft.items[k].cueOpen = !draft.items[k].cueOpen; render(); }
  else if (a === "up" || a === "down") { var list = draft.todo.indexOf(k) >= 0 ? draft.todo : draft.done; moveIn(list, k, a === "up" ? -1 : 1); saveDraft(); render(); }
  else if (a === "done") finish(k, "done");
  else if (a === "skip") finish(k, "skipped");
  else if (a === "undo") { var it = draft.items[k]; it.status = "todo"; it.doneAt = null; draft.done = draft.done.filter(function (x) { return x !== k; }); draft.todo.unshift(k); draft.open = k; saveDraft(); render(); $("scroller").scrollTop = 0; }
  else if (a === "close") { draft.open = draft.todo[0] || null; saveDraft(); render(); }
  else if (a === "note") { var it2 = draft.items[k]; it2.noteOpen = true; render(); var t = document.querySelector('[data-f="note"][data-k="' + k + '"]'); if (t) t.focus(); }
  else if (a === "swap") openSwap(k);
  else if (a === "save") saveSession();
  else if (a === "feel") { ruck.feel = ruck.feel === b.getAttribute("data-v") ? "" : b.getAttribute("data-v"); saveRuck(); render(); }
  else if (a === "saveruck") saveRuckSession();
  else if (a === "newsess") startNew();
  else if (a === "copynew") copyNew();
  else if (a === "copyerr") copyText(errorText(), function () { toast("Copied — paste it to Claude"); });
  else if (a === "xcat") { extraState.cat = b.getAttribute("data-v"); keepExtra(); }
  else if (a === "xfeel") { var fv = b.getAttribute("data-v"); extraState.feel = extraState.feel === fv ? "" : fv; keepExtra(); }
  else if (a === "saveextra") saveExtra();
  else if (a === "hist") { var id = Number(b.getAttribute("data-id")); openHist = openHist === id ? null : id; render(); }
  else if (a === "del") {
    var id2 = Number(b.getAttribute("data-id")), s = findSession(id2);
    if (!s || !confirm("Delete " + sessTitle(s) + ", " + fmtDate(s.date) + "? This can’t be undone.")) return;
    DATA.sessions = DATA.sessions.filter(function (x) { return x.id !== id2; }); if (DATA.savedState && DATA.savedState.id === id2) delete DATA.savedState;
    openHist = null; persist(); render(); toast("Deleted");
  }
  else if (a === "backup") backup();
  else if (a === "restore") $("restoreFile").click();
  else if (a === "copyall") copyText(buildText(DATA.sessions), function () { toast("Copied full history"); });
  else if (a === "copybackup") copyText(JSON.stringify(DATA), function () { markBackedUp(); toast("Backup copied as text"); });
  else if (a === "restoretext") { var v = ($("pastebox").value || "").trim(); if (!v) { toast("Paste a backup into the box first"); $("pastebox").focus(); return; } mergeRestore(v); }
});
/* keep typed Extra values when chips re-render */
function keepExtra() {
  var keep = {}; ["exDate", "exDur", "exHrA", "exHrM", "exText"].forEach(function (id) { var el = $(id); if (el) keep[id] = el.value; });
  render(); Object.keys(keep).forEach(function (id) { if ($(id)) $(id).value = keep[id]; });
}
function saveExtra() {
  var dur = $("exDur").value, text = $("exText").value.trim();
  if (!extraState.cat && !dur && !text) { toast("Pick a category or describe what you did"); return; }
  var rec = { id: Date.now(), type: "extra", date: $("exDate").value || todayISO(), category: extraState.cat || "Other", duration: dur, hrAvg: $("exHrA").value, hrMax: $("exHrM").value, feel: extraState.feel, text: text };
  DATA.sessions.push(rec); persist(); extraState = { cat: "", feel: "" }; tab = "history"; openHist = rec.id; $("scroller").scrollTop = 0; render(); toast("Extra session saved");
}
$("view").addEventListener("input", function (e) {
  var el = e.target;
  if (el.id === "snote") { draft.snote = el.value; saveDraft(); return; }
  if (el.id === "bw") { DATA.bodyweight = el.value.trim(); persist(); return; }
  var r = el.getAttribute("data-r"); if (r) { ruck[r] = el.value; saveRuck(); return; }
  var k = el.getAttribute("data-k"), f = el.getAttribute("data-f"); if (!k || !f || !draft) return;
  var it = draft.items[k];
  if (f === "set") it.sets[Number(el.getAttribute("data-i"))] = el.value.trim();
  else if (f === "load") it.load = el.value.trim();
  else if (f === "rir") it.rir = el.value.trim();
  else if (f === "text") it.text = el.value;
  else if (f === "note") { it.note = el.value; var nb = $("nb-" + k); if (nb) { var has = !!it.note.trim(); nb.classList.toggle("has", has); nb.innerHTML = (has ? ICON.smalltick : "") + "Note"; } }
  saveDraft();
});
$("view").addEventListener("change", function (e) {
  if (e.target.id === "restoreFile") {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var rd = new FileReader(); rd.onload = function () { mergeRestore(String(rd.result)); }; rd.readAsText(f); e.target.value = "";
  }
});
$("hdr").addEventListener("click", function (e) { var b = e.target.closest("[data-act=mode]"); if (b) switchMode(b.getAttribute("data-m")); });
$("hdr").addEventListener("change", function (e) {
  if (e.target.id !== "dateIn" || !e.target.value) return;
  if (mode === "ruck") { ruck.date = e.target.value; saveRuck(); } else { draft.date = e.target.value; saveDraft(); }
  render();
});
document.querySelectorAll("nav button").forEach(function (b) {
  b.onclick = function () { var t = b.getAttribute("data-tab"); if (t === tab) { $("scroller").scrollTop = 0; return; } tab = t; $("scroller").scrollTop = 0; render(); };
});

/* ---- collapsing header: slim bar once the big title scrolls away ---- */
var io = null;
function observeTitle() {
  if (!("IntersectionObserver" in window)) return;
  if (io) io.disconnect();
  var t = $("bigTitle"); if (!t) return;
  io = new IntersectionObserver(function (en) { $("compact").classList.toggle("show", !en[0].isIntersecting); }, { root: $("scroller"), threshold: 0 });
  io.observe(t);
}
/* ---- typing: pause snapping, keep the box above the keyboard, undo iOS drift ---- */
function isField(el) { return el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA"); }
document.addEventListener("focusin", function (e) {
  if (!isField(e.target)) return;
  $("scroller").classList.remove("snap");
  var el = e.target;
  setTimeout(function () {
    var vv = window.visualViewport; if (!vv || document.activeElement !== el) return;
    var r = el.getBoundingClientRect(), limit = vv.height + vv.offsetTop - 24;
    if (r.bottom > limit) $("scroller").scrollTop += (r.bottom - limit + 40);
  }, 320);
});
document.addEventListener("focusout", function () {
  setTimeout(function () {
    if (isField(document.activeElement)) return;
    $("scroller").classList.toggle("snap", snapAllowed());
    if (window.scrollY || document.documentElement.scrollTop) window.scrollTo(0, 0);
  }, 120);
});
function snapAllowed() { return OK && tab === "workout" && !DATA.savedState && mode !== "ruck" && !!document.querySelector(".card.open.snapme"); }
function afterRender() { if (!isField(document.activeElement)) $("scroller").classList.toggle("snap", snapAllowed()); }
/* Enter on the number pad moves to the next box in the same card */
document.addEventListener("keydown", function (e) {
  if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
  var card = e.target.closest(".card"); if (!card) return;
  var ins = Array.prototype.slice.call(card.querySelectorAll("input")), i = ins.indexOf(e.target);
  e.preventDefault(); if (i >= 0 && i < ins.length - 1) ins[i + 1].focus(); else e.target.blur();
});

/* ---- offline cache ---- */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}

render();
